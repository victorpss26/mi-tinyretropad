name: Build trpad.exe

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install NASM Assembler
      run: |
        choco install nasm -y
        echo "C:\Program Files\NASM" >> $GITHUB_PATH
      shell: bash

    - name: Fetch Crinkler
      run: |
        curl -L -o crinkler.zip "https://github.com"
        powershell Expand-Archive crinkler.zip -DestinationPath crinkler
      shell: cmd

    - name: Set up AMD64 Visual Studio toolchain
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Run Build Direct
      run: |
        copy crinkler\win64\crinkler.exe .
        nasm -f win64 trpad.asm -o trpad.obj
        crinkler /SUBSYSTEM:WINDOWS /ENTRY:EntryPoint user32.lib gdi32.lib comctl32.lib comdlg32.lib kernel32.lib trpad.obj /OUT:trpad.exe
      shell: cmd

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trpad-exe
        path: trpad.exe
