name: build.yml

on:
  workflow_dispatch: # Esto te permite ejecutarlo manualmente con un botón

jobs:
  build:
    runs-on: windows-latest # Usa una máquina virtual con Windows

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Instalar MASM32
      run: |
        # Descarga un SDK de MASM32 ya extraído para evitar instaladores gráficos
        Invoke-WebRequest -Uri "https://github.com/tonado/MASM32-SDK/archive/refs/heads/master.zip" -OutFile "masm32.zip"
        Expand-Archive -Path "masm32.zip" -DestinationPath "C:\"
        if (Test-Path "C:\MASM32-SDK-master") {
            Rename-Item -Path "C:\MASM32-SDK-master" -NewName "masm32"
        }
        echo "C:\masm32\bin" >> $env:GITHUB_PATH

    - name: Instalar Crinkler
      run: |
        # 1. Crear la carpeta de herramientas
        New-Item -ItemType Directory -Force -Path "C:\tools" | Out-Null
        
        # 2. Descargar el ZIP correcto desde el release v2.3
        $zipUrl = "https://github.com/runestubbe/Crinkler/releases/download/v2.3/crinkler23.zip"
        Invoke-WebRequest -Uri $zipUrl -OutFile "C:\tools\crinkler23.zip"
        
        # 3. Extraer el contenido del ZIP en la misma carpeta
        Expand-Archive -Path "C:\tools\crinkler23.zip" -DestinationPath "C:\tools" -Force
        
        # 4. Mostrar qué archivos se extrajeron (para depuración, opcional)
        Get-ChildItem -Path "C:\tools" -Recurse
        
        # 5. Añadir C:\tools al PATH para que 'crinkler.exe' sea accesible
        echo "C:\tools" >> $env:GITHUB_PATH

    - name: Adaptar build.bat a la ruta del SDK del runner
      run: |
        # Detecta automáticamente la versión del SDK de Windows en la máquina de GitHub
        $sdkPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\Lib" -Directory | Select-Object -Last 1
        $libPath = Join-Path $sdkPath.FullName "um\x86"
        Write-Host "Usando SDK en: $libPath"
        # Reemplaza la ruta de LIBPATH en build.bat para que coincida
        (Get-Content build.bat) -replace '/LIBPATH:.*', "/LIBPATH:`"$libPath`"" | Set-Content build.bat

    - name: Compilar con build.bat
      run: .\build.bat

    - name: Subir el ejecutable como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: TinyRetroPad-exe
        path: trpad.exe # El nombre del archivo final
