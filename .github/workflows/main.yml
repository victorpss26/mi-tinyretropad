name: Build TinyRetroPad

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Instalar MASM32
      run: |
        Invoke-WebRequest -Uri "https://github.com/tonado/MASM32-SDK/archive/refs/heads/master.zip" -OutFile "masm32.zip"
        Expand-Archive -Path "masm32.zip" -DestinationPath "C:\"
        if (Test-Path "C:\MASM32-SDK-master") {
            Rename-Item -Path "C:\MASM32-SDK-master" -NewName "masm32"
        }
        echo "C:\masm32\bin" >> $env:GITHUB_PATH

    - name: Compilar sin Crinkler (Bajo consumo de RAM)
      run: |
        # 1. Ensamblar el archivo .asm
        C:\masm32\bin\ml.exe /nologo /c /coff /Cp /IC:\masm32\include trpad.asm
        
        # 2. Buscar automáticamente la versión del SDK de Windows que tenga GitHub
        $sdkVersion = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Lib" | Sort-Object Name -Descending | Select-Object -First 1
        $libPath = "C:\Program Files (x86)\Windows Kits\10\Lib\$($sdkVersion.Name)\um\x86"
        Write-Host "Usando SDK en: $libPath"
        
        # 3. Enlazar (crear el .exe)
        C:\masm32\bin\link.exe trpad.obj /NOLOGO /OUT:trpad.exe /SUBSYSTEM:WINDOWS /LIBPATH:"$libPath" kernel32.lib user32.lib shell32.lib comdlg32.lib gdi32.lib
        
        # 4. Comprobar si el archivo se creó con éxito (Si no, pone la acción en rojo)
        if (-not (Test-Path trpad.exe)) {
            Write-Error "¡Error! trpad.exe no se generó."
            exit 1
        }
        
        # 5. Limpiar
        del trpad.obj

    - name: Subir el ejecutable como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: TinyRetroPad-exe
        path: trpad.exe
        if-no-files-found: error # Si no encuentra el .exe, avisa en rojo
